name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A new push to the same branch cancels the run still in flight, so the queue
# never fills with results nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

  test:
    name: Tests
    runs-on: ubuntu-latest

    # Real Postgres and Redis, so the integration tests actually run here rather
    # than skipping the way they do on a laptop with no stack up.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      OPSPILOT_ENVIRONMENT: ci
      OPSPILOT_DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@localhost:5432/opspilot
      OPSPILOT_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      # Proves migrations apply to an empty database, which is exactly what a
      # deploy does. A broken migration fails here instead of in staging.
      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml
          retention-days: 7

  build:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the production stage only. Catches a broken Dockerfile or a
      # dependency that does not install in the image before a release does.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: opspilot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint python opspilot:${{ github.sha }} \
            -c "import app.main; print('image imports the app cleanly')"
